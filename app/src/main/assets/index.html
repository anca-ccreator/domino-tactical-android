<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domino Tactical</title><style>
*{box-sizing:border-box}body{margin:0;background:#102c25;color:#f4f6ef;font:16px system-ui}main{max-width:620px;margin:auto;padding:16px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:8px 0}small,p{color:#bed3c7}section{background:#1c4035;border:1px solid #396154;border-radius:15px;padding:12px;margin:12px 0}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px;background:#dce9d9;color:#152e24}button:disabled{opacity:.35}button.primary{background:#a9e6a5;font-weight:700}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.tile{padding:7px 1px;background:#fff5da;font-weight:700;font-size:15px;white-space:nowrap}.tile.sel{background:#9be3a3;outline:2px solid #fff}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.muted{font-size:13px}select{padding:9px;border-radius:8px;background:#fff;color:#172e25}#status{min-height:20px;color:#ffdb9b}.rec{border-left:3px solid #a9e6a5;padding:6px 9px;margin:6px 0}.ends{text-align:center;font-size:26px;font-weight:bold}label{display:block;margin:6px 0}summary{cursor:pointer} </style><main><h1>Domino Tactical</h1><small>28 kartu · 4 pemain · offline</small><p class="muted">Untuk permainan tanpa taruhan dengan persetujuan seluruh pemain.</p><div id="app"></div><div id="status" role="status"></div></main><script>
const tiles=[];for(let a=0;a<7;a++)for(let b=a;b<7;b++)tiles.push(a+'-'+b);const names=['Anda','Lawan A','Pasangan','Lawan B'];const nums=t=>t.split('-').map(Number);const has=(t,n)=>nums(t).includes(n);const empty=()=>({hand:[],moves:[],first:0,started:false});let s=empty();try{const v=JSON.parse(localStorage.getItem('domino-v1'));if(v&&Array.isArray(v.hand)&&Array.isArray(v.moves))s=v}catch(e){};let chosen=null;const el=document.getElementById('app');function save(){try{localStorage.setItem('domino-v1',JSON.stringify(s))}catch(e){}}function msg(t){document.getElementById('status').textContent=t}function state(){let ends=null,turn=s.first,counts=[7,7,7,7],used=[],forbid=[[],[],[],[]],passes=0,winner=null,blocked=false;for(const m of s.moves){if(m.tile){const [a,b]=nums(m.tile);if(!ends)ends=[a,b];else{let i=m.side==='R'?1:0;ends[i]=a===ends[i]?b:a}counts[turn]--;used.push(m.tile);passes=0;if(counts[turn]===0)winner=turn}else{forbid[turn]=[...new Set([...forbid[turn],...ends])];passes++;if(passes===4)blocked=true}turn=(turn+1)%4}return{ends,turn,counts,used,forbid,winner,blocked}}function hand(g){return s.hand.filter(t=>!g.used.includes(t))}function available(g){if(g.winner!==null||g.blocked)return[];return (g.turn===0?hand(g):tiles.filter(t=>!s.hand.includes(t)&&!g.used.includes(t)&&!g.forbid[g.turn].some(n=>has(t,n)))).filter(t=>!g.ends||g.ends.some(n=>has(t,n)))}function candidates(g,p){return tiles.filter(t=>!s.hand.includes(t)&&!g.used.includes(t)&&!g.forbid[p].some(n=>has(t,n)))}
// Enumerate feasible allocations of hidden tiles using exact hand sizes and pass constraints.
function feasible(g,limit=2400){let u=tiles.filter(t=>!s.hand.includes(t)&&!g.used.includes(t)),ps=[1,2,3],cap=g.counts.slice(),out=[],nodes=0,cut=false;let opts=Object.fromEntries(u.map(t=>[t,ps.filter(p=>!g.forbid[p].some(n=>has(t,n)))]));u.sort((a,b)=>opts[a].length-opts[b].length);let h=[[],[],[],[]];function go(i){if(out.length>=limit||nodes++>100000){cut=true;return}if(i===u.length){if(ps.every(p=>cap[p]===0))out.push(h.map(a=>a.slice()));return}let t=u[i];for(let p of opts[t])if(cap[p]){cap[p]--;h[p].push(t);go(i+1);h[p].pop();cap[p]++}}go(0);return{out,cut}}
function rank(g){return available(g).flatMap(t=>{let sides=!g.ends?['L']:['L','R'].filter((x,i)=>has(t,g.ends[i]));return sides.map(side=>{let e=g.ends?g.ends.slice():nums(t),i=side==='R'?1:0;if(g.ends){let [a,b]=nums(t);e[i]=a===e[i]?b:a}let left=hand(g).filter(x=>x!==t),own=left.filter(x=>e.some(n=>has(x,n))).length;let deny=e.every(n=>g.forbid[1].includes(n));let partner=e.filter(n=>!g.forbid[2].includes(n)).length;let score=left.length===0?1000:own*3+(deny?8:0)+partner*2+nums(t).reduce((a,b)=>a+b,0)*.12;return{t,side,score,why:left.length===0?'Menghabiskan kartu Anda.':`Akses kartu sendiri: ${own}; ${deny?'Lawan A pasti tidak dapat bermain pada ujung ini.':'Lawan A belum pasti lewat.'} Ujung yang tidak tercatat terlarang bagi pasangan: ${partner}/2.`}}) }).sort((a,b)=>b.score-a.score)}
function render(){let g=state();if(!s.started){el.innerHTML=`<section><h2>Pilih 7 kartu Anda (${s.hand.length}/7)</h2><div class="grid">${tiles.map(t=>`<button class="tile ${s.hand.includes(t)?'sel':''}" onclick="pick('${t}')">${t}</button>`).join('')}</div><label>Pemain pembuka <select onchange="s.first=+this.value;save()">${names.map((n,i)=>`<option value="${i}" ${i===s.first?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" ${s.hand.length!==7?'disabled':''} onclick="start()">Mulai permainan</button></section>`;return}let end=g.winner!==null||g.blocked;let a=available(g);let r=g.turn===0&&!end?rank(g):[];el.innerHTML=`<section><div class="ends">${g.ends?g.ends.join('  |  '):'Pembukaan'}</div><h2>${end?(g.blocked?'Gaple — permainan terkunci':names[g.winner]+' habis kartu'):'Giliran: '+names[g.turn]}</h2><div class="row">${names.map((n,i)=>`<small>${n}<br><b>${g.counts[i]} kartu</b></small>`).join('')}</div></section><section><h2>Kartu Anda</h2><div class="row">${hand(g).map(t=>`<button class="tile" ${g.turn!==0||!a.includes(t)?'disabled':''} onclick="choose('${t}')">${t}</button>`).join('')}</div></section>${end?'':`<section><h2>Catat langkah ${names[g.turn]}</h2><div class="grid">${a.map(t=>`<button class="tile ${chosen===t?'sel':''}" onclick="choose('${t}')">${t}</button>`).join('')}</div>${chosen?`<p>Kartu ${chosen}: pilih ujung</p><div class="row">${(!g.ends?['L']:['L','R'].filter((x,i)=>has(chosen,g.ends[i]))).map(x=>`<button class="primary" onclick="play('${x}')">${!g.ends?'Buka':x==='L'?'Kiri':'Kanan'}</button>`).join('')}</div>`:''}<p><button onclick="pass()" ${!g.ends||(g.turn===0&&a.length)?'disabled':''}>Lewat</button></p></section>`}${r.length?`<section><h2>Rekomendasi taktis</h2><small>Skor heuristik, bukan peluang menang.</small>${r.slice(0,3).map(x=>`<div class="rec"><b>${x.t} · ${x.side==='L'?'kiri':'kanan'}</b><br><small>${x.why}</small></div>`).join('')}</section>`:''}<section><h2>Deduksi kartu</h2>${[1,2,3].map(p=>`<p><b>${names[p]}</b> · tidak punya: ${g.forbid[p].join(', ')||'belum diketahui'}<br><small>Kandidat: ${candidates(g,p).join(' · ')||'—'}</small></p>`).join('')}<button onclick="check()">Uji konsistensi distribusi</button><p id="check"></p></section><section><details><summary>Riwayat (${s.moves.length})</summary>${s.moves.map((m,i)=>`<p>${i+1}. ${names[(s.first+i)%4]}: ${m.tile||'Lewat'} ${m.tile?m.side:''}</p>`).join('')}</details><p class="row"><button onclick="undo()" ${!s.moves.length?'disabled':''}>Koreksi</button><button onclick="reset()">Babak baru</button></p></section>`}
function pick(t){if(s.hand.includes(t))s.hand=s.hand.filter(x=>x!==t);else if(s.hand.length<7)s.hand.push(t);save();render()}function start(){if(s.hand.length===7){s.started=true;save();render()}}function choose(t){chosen=t;msg('');render()}function commit(m){s.moves.push(m);let f=feasible(state(),1);if(!f.out.length&&!f.cut){s.moves.pop();msg('Langkah tidak konsisten dengan kartu atau riwayat lewat.');return}chosen=null;save();msg('');render()}function play(side){let g=state();if(!chosen||!available(g).includes(chosen))return;let t=chosen;if(g.ends&&!has(t,g.ends[side==='R'?1:0]))return;commit({tile:t,side})}function pass(){let g=state();if(!g.ends||g.winner!==null||g.blocked||g.turn===0&&available(g).length)return;commit({})}function undo(){s.moves.pop();chosen=null;save();render();msg('')}function reset(){if(confirm('Hapus babak ini dan mulai lagi?')){s=empty();chosen=null;save();render();msg('')}}function check(){let f=feasible(state());document.getElementById('check').textContent=f.out.length?(f.cut?'Ditemukan setidaknya ':'Ditemukan ')+f.out.length+' distribusi yang konsisten.':'Tidak ditemukan distribusi'+(f.cut?' dalam batas pencarian.':'.')};render();
</script></html>
